[project]
name = "class-homework-builder"
version = "0.1.0"
description = "Curriculum-driven homework generation microservice"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.27",
    "uvicorn[standard]>=0.46.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "notion-client>=2.2.1",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "sse-starlette>=2.1.3",
    "loguru>=0.7.2",
    "pypdf>=6.13.3",
    "psutil>=5.9",
    "google-genai>=2.8.0",
    "anthropic>=0.109.2",
    "openai>=2.45.0",
    "pywin32>=311 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "real_events_bus: opt out of the conftest _notify loopback (needs real pg_notify)",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
]
